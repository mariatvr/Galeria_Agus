<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Uñas - Mis Trabajos</title>
</head>
<body>
    <header>
        <a href="index.html">
            <img src="logo minimalista.png" alt="Logo artista" class="logo">
        </a>
        <nav>
            <aside id="nav-aside">
                <ul>
                    <li><a href="tatuajes.html">Tatuajes</a></li>
                    <li><a href="uñas.html">Uñas</a></li>
                    <li><a href="peinados.html">Peinados</a></li>
                    <li><a href="contacto.html">Contacto</a></li>
                </ul>
            </aside>
        </nav>
    </header>

    <main>
        <div class="galeria-header">
            <h1>Mis Diseños de Uñas</h1>
            <p>Ideas plasmadas de pinterest solicitadas por los clientes.</p>
        </div>

        <!-- Cuadrícula de la galería tipo tarjetitas -->
        <section class="galeria-grid" id="galeria-uñas">
        <!-- El script generará las tarjetas aquí automáticamente -->
        </section>

        <script>
            const contenedor = document.getElementById('galeria-peinados');
            const totalFotos = 16; // Cambia a 25 cuando hagas la de uñas

            for (let i = 1; i <= totalFotos; i++) {
                const tarjeta = document.createElement('div');
                tarjeta.className = 'tarjeta';
                
                tarjeta.innerHTML = `
                    <img src="peinados/peinado${i}.jpeg" alt="Peinado ${i}" loading="lazy">
                `;
                contenedor.appendChild(tarjeta);
            }
        </script>
    </main>

    <footer>
        <p>© 2026 Aficionada a tatuajes, manicura y peluquería.</p>
    </footer>
</body>
</html>
